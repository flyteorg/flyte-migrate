[project]
name = "flyte-migrate"
dynamic = ["version"]
description = "migrate v1 workflows to v2"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "flyte",
    "flytekit",
    "flyteidl2",
]

[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "build>=1.2.2.post1",
    "mock>=5.2.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-benchmark>=5.1.0",
    "pytest-xdist>=3.6.1",
    "ruff>=0.11.0",
    "setuptools-scm>=8.2.0",
    "flytekitplugins-bigquery",
    "flytekitplugins-deck-standard",
    "flytekitplugins-spark",
    "flyteplugins-spark",
    "flytekitplugins-dask",
    "flyteplugins-dask",
    "flytekitplugins-ray",
    "flyteplugins-ray",
    "flytekitplugins-kfpytorch",
    "flyteplugins-pytorch",
    "google-cloud-bigquery>=3.31.0",
    "pandas",
    "pyarrow",
    "orjson",
    "docstring_parser",
    "jupyterlab>=4.4.3",
    "ipywidgets>=8.1.7",
    "mypy>=1.16.0",
    "kubernetes",
]

[tool.setuptools]
include-package-data = true
license-files = ["licenses/*.txt", "LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["flyte_migrate*"]

[tool.setuptools_scm]
root = "."

[tool.pytest.ini_options]
norecursedirs = []
log_cli = true
log_cli_level = 20
markers = [
    "integration: runs examples against a real cluster; opt in with -m integration",
    "plugins: integration examples needing cluster operators or external services",
]
addopts = "-m 'not integration'"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "PLW",
    "YTT",
    "ASYNC",
    "C4",
    "T10",
    "EXE",
    "ISC",
    "LOG",
    "PIE",
    "Q",
    "RSE",
    "FLY",
    "PGH",
    "PLC",
    "PLE",
    "PLW",
    "FURB",
    "RUF",
]
ignore = ["PGH003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]

[tool.uv]
prerelease = "allow"
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[tool.mypy]
disable_error_code = ["import-untyped"]
ignore_missing_imports = true