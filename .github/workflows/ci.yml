name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Check formatting with ruff
        run: |
          uv run python -m ruff format --check || {
            echo "Formatting check failed. Run 'make fmt' locally to auto-fix."
            exit 1
          }

      - name: Lint with ruff
        run: |
          uv run python -m ruff check . || {
            echo "Linting check failed. Run 'make fmt' locally to auto-fix."
            exit 1
          }

      - name: Type check with mypy
        run: |
          uv run python -m mypy --config-file pyproject.toml src/ || {
            echo "Type check failed. Run 'make mypy' locally to see errors."
            exit 1
          }
